name: ci

# Every claim this project makes is a job in this file. If a claim is not
# checked here, it is not a claim -- it is an opinion.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shipped header is generated. If it drifts from src/, everything below
  # is testing something nobody will ever download.
  amalgamation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make check-amalgamation

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          # macOS "gcc" is a clang shim; running it adds no signal.
          - os: macos-latest
            cc: gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make test
        env:
          CC: ${{ matrix.cc }}

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: make asan
        env:
          CC: clang

  # MemorySanitizer is Linux-only: there is no libclang_rt.msan for
  # macOS/arm64. Uninitialised-read coverage lives here or nowhere.
  memory-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make msan

  # The design invariants, checked on the compiled artifact. This is what makes
  # the table in README.md a claim rather than an aspiration.
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make invariants
        env:
          CLANG: clang

  # A short seeded run of every fuzz target. This is a regression gate, not a
  # security argument -- that needs continuous fuzzing, which needs OSS-Fuzz --
  # but a crash reachable from a specification sample should never be committed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - run: make fuzz-smoke FUZZ_SECONDS=45
        env:
          CLANG: clang
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install analysers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck
          # Pinned: clang-format's output changes between major versions, and
          # the distribution package tracks a different one from the developer
          # machines. See CLANG_FORMAT_VERSION in the Makefile.
          pip install --quiet clang-format==23.1.0
      - run: make format-check
        env:
          CLANG_FORMAT: clang-format
      - run: make tidy
      - run: make cppcheck
      - run: make check-metrics

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tools
      - run: make analyze

  # Not a gate -- a ratchet. The number is the headline claim, so it is
  # measured on every commit rather than quoted from memory.
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: make size | tee -a "$GITHUB_STEP_SUMMARY"
