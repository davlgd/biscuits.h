name: codeql

# CodeQL detects the largest share of CWE classes of the SAST tools measured
# in recent benchmarks, and it is free for this repository. It runs weekly as
# well as on changes, because its query pack improves even when we do not.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-extended,security-and-quality

      - name: Build
        run: make unit

      - uses: github/codeql-action/analyze@v3
