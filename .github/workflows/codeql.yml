name: codeql

# CodeQL detects the largest share of CWE classes of the SAST tools measured
# in recent benchmarks, and it is free for this repository. It runs weekly as
# well as on changes, because its query pack improves even when we do not.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Uploading results to code scanning needs GitHub Advanced Security on a
    # private repository. Until this one is public the upload fails with
    # "Resource not accessible by integration" -- a licensing outcome that
    # says nothing about the code, and a red job that means nothing is worse
    # than no job at all. This turns itself on the day the repo goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-extended,security-and-quality

      - name: Build
        run: make unit

      - uses: github/codeql-action/analyze@v3
